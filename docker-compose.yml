# Pilha completa local para o modo LiveKit. Suba o servidor de mídia sozinho com:
#   docker compose up -d livekit
# ou tudo (API + LiveKit) com:
#   docker compose up --build
#
# A API também roda fora do compose com `bun run dev` apontando para
# LIVEKIT_URL=ws://localhost:7880 (chaves devkey/secret do modo --dev).
services:
  livekit:
    image: livekit/livekit-server:v1.9.1
    command: --dev --bind 0.0.0.0
    ports:
      - '7880:7880' # HTTP + WebSocket de signaling
      - '7881:7881' # ICE/TCP
      - '7882:7882/udp' # ICE/UDP (mux)
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:7880']
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    depends_on:
      livekit:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      PORT: '3000'
      NODE_ENV: production
      MEDIA_PROVIDER: livekit
      # Dentro da rede do compose o host do LiveKit é "livekit"; no navegador do
      # desenvolvedor é localhost. Para testes locais aponte para o host:
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      ROOM_TOKEN_SECRET: ${ROOM_TOKEN_SECRET:-development-only-room-token-secret-change-me}
      LIVEKIT_TOKEN_TTL: 10m

  # Só é necessário para escalar o LiveKit para mais de um nó (roteamento entre nós).
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - '6379:6379'
