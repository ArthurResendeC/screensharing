# fly.toml — servidor LiveKit (SFU). A API Bun continua no Railway e aponta para
# LIVEKIT_URL=wss://<app>.fly.dev. Passo a passo em fly-deploy.md.
# Segredos: `fly secrets set LIVEKIT_KEYS="APIxxxx: xxxx"`.

app = 'reshare-livekit'
primary_region = 'gru'

[experimental]
  cmd = ['--config', '/etc/livekit/livekit.yaml']

[build]
  image = 'livekit/livekit-server:v1.9.1'

[[files]]
  guest_path = '/etc/livekit/livekit.yaml'
  local_path = 'livekit.yaml'

# Signaling HTTP/WebSocket — TLS terminado pelo Fly (wss://<app>.fly.dev -> 7880).
[[services]]
  protocol = 'tcp'
  internal_port = 7880
  # Desliga quando ocioso para economizar. 'suspend' (não 'stop') retoma em ~1s
  # preservando a RAM; enquanto houver alguém na sala há conexão de signaling e a
  # máquina não suspende — só quem entra primeiro após um período ocioso espera o
  # wake, que dispara nesta porta TCP/TLS (o cliente abre o wss antes do UDP).
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.ports]]
    port = 80
    handlers = ['http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 400
    soft_limit = 200

# ICE/UDP (mux). Só funciona com IPv4 dedicado (`fly ips allocate-v4`, ~US$2/mês).
# No IPv4 compartilhado o Fly não roteia UDP — descomente junto com `udp_port` no
# livekit.yaml se alocar o IP.
# [[services]]
#   protocol = 'udp'
#   internal_port = 7882
#   [[services.ports]]
#     port = 7882

# ICE/TCP — rota de mídia principal enquanto não houver IPv4 dedicado.
[[services]]
  protocol = 'tcp'
  internal_port = 7881

  [[services.ports]]
    port = 7881

# TURN sobre TLS (5349) — para redes que só deixam sair 443/TLS.
[[services]]
  protocol = 'tcp'
  internal_port = 5349

  [[services.ports]]
    port = 5349
    handlers = ['tls']

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1gb'
