# Servidor LiveKit no Fly.io. A API Bun continua no Railway e aponta para
# LIVEKIT_URL=wss://<app>.fly.dev. Veja fly-deploy.md para o passo a passo.
app = "reshare-livekit"
primary_region = "gru" # escolha a região mais próxima dos usuários

[build]
image = "livekit/livekit-server:v1.9.1"

[experimental]
cmd = ["--config", "/etc/livekit/livekit.yaml"]

# Monta a configuração (sem segredos) na imagem oficial.
[[files]]
guest_path = "/etc/livekit/livekit.yaml"
local_path = "livekit.yaml"

[env]
# Segredos ficam em `fly secrets set LIVEKIT_KEYS="chave: segredo"`.

# Signaling HTTP/WebSocket — TLS terminado pelo Fly, wss://<app>.fly.dev -> 7880.
[[services]]
internal_port = 7880
protocol = "tcp"
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1
[[services.ports]]
port = 443
handlers = ["tls", "http"]
[[services.ports]]
port = 80
handlers = ["http"]
[services.concurrency]
type = "connections"
hard_limit = 400
soft_limit = 200

# ICE/UDP (mux). Requer um IPv4 dedicado: `fly ips allocate-v4`.
[[services]]
internal_port = 7882
protocol = "udp"
[[services.ports]]
port = 7882

# ICE/TCP — fallback quando UDP é bloqueado.
[[services]]
internal_port = 7881
protocol = "tcp"
[[services.ports]]
port = 7881

# TURN sobre TLS (5349) — para redes que só deixam sair 443/TLS.
[[services]]
internal_port = 5349
protocol = "tcp"
[[services.ports]]
port = 5349
handlers = ["tls"]

[[vm]]
size = "shared-cpu-2x"
memory = "1gb"
